name: PR Check

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            backend:
              - 'backend/**'
              - 'ruff.toml'
              - 'tests/**'

  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  backend-check:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest

      - name: Gunicorn boot smoke test
        run: |
          gunicorn -w 1 -b 127.0.0.1:5000 app.main:app \
            --daemon --pid /tmp/g.pid --error-logfile /tmp/g.err
          ok=0
          for i in $(seq 1 10); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null; then
              echo "✅ gunicorn boot OK"
              ok=1
              break
            fi
            sleep 1
          done
          [ -f /tmp/g.pid ] && kill "$(cat /tmp/g.pid)" 2>/dev/null || true
          if [ "$ok" != "1" ]; then
            echo "❌ gunicorn boot failed — error log:"
            cat /tmp/g.err || true
            exit 1
          fi
